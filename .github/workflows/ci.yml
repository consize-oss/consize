name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./ui/package.json").packageManager')"

      - name: Install locked contract tools
        working-directory: ui
        run: npm ci

      - name: Validate and lint canonical contract
        working-directory: ui
        run: npx --no-install redocly lint ../openapi/openapi.yaml --config ../redocly.yaml

      - name: Verify implemented routes and correlation contract
        run: go test ./internal/api -run OpenAPI

      - name: Detect generated declaration drift
        run: scripts/api/check-generated.sh

      - name: Install pinned compatibility checker
        env:
          GOBIN: ${{ runner.temp }}
        run: go install github.com/oasdiff/oasdiff@v1.29.1

      - name: Test compatibility controls
        env:
          OASDIFF_BIN: ${{ runner.temp }}/oasdiff
        run: scripts/api/test-contract.sh

      - name: Reject breaking API changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          OASDIFF_BIN: ${{ runner.temp }}/oasdiff
        shell: bash
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) echo "Unsupported API contract event: $EVENT_NAME"; exit 2 ;;
          esac
          [[ "$base" != "0000000000000000000000000000000000000000" ]] || {
            echo "Comparison base is unavailable; refusing an incomplete compatibility result."
            exit 2
          }
          scripts/api/compare-breaking.sh "$base"

      - name: Bundle contract and revision manifest
        run: scripts/api/bundle.sh "$RUNNER_TEMP/api-contract"

      - name: Upload contract evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-contract/
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Install checksum-verified Gitleaks
        run: scripts/security/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Test secret-scan controls
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: scripts/security/test-gitleaks.sh

      - name: Scan tracked source and introduced commits
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          SCAN_CONTEXT: ${{ github.event_name == 'pull_request' && 'pull_request' || github.event_name == 'push' && 'default_branch' || 'build' }}
        shell: bash
        run: |
          scripts/security/run-gitleaks.sh snapshot "$RUNNER_TEMP/gitleaks-snapshot.json"
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) echo "Unsupported secret scan event: $EVENT_NAME"; exit 2 ;;
          esac
          [[ "$base" != "0000000000000000000000000000000000000000" ]] || {
            echo "The comparison base is the all-zero Git sentinel; refusing an incomplete scan."
            exit 2
          }
          scripts/security/run-gitleaks.sh range "$RUNNER_TEMP/gitleaks-history.json" "$base"

      - name: Evaluate snapshot findings
        run: |
          go run ./cmd/security-policy evaluate \
            --policy .github/security/policy.json \
            --exceptions .github/security/exceptions.json \
            --report "$RUNNER_TEMP/gitleaks-snapshot.json" \
            --output "$RUNNER_TEMP/gitleaks-snapshot-decision.json"

      - name: Evaluate introduced-history findings
        run: |
          go run ./cmd/security-policy evaluate \
            --policy .github/security/policy.json \
            --exceptions .github/security/exceptions.json \
            --report "$RUNNER_TEMP/gitleaks-history.json" \
            --output "$RUNNER_TEMP/gitleaks-history-decision.json"

      - name: Upload redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitleaks-snapshot.json
            ${{ runner.temp }}/gitleaks-history.json
            ${{ runner.temp }}/gitleaks-snapshot-decision.json
            ${{ runner.temp }}/gitleaks-history-decision.json
          if-no-files-found: warn
          retention-days: 14

  security-policy:
    name: Security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject mutable GitHub Action references
        shell: bash
        run: |
          invalid_refs="$(grep -REn '^[[:space:]]*uses:[[:space:]]+[^[:space:]]+@' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]+#.*)?$' || true)"
          if [[ -n "$invalid_refs" ]]; then
            printf 'GitHub Actions must use immutable commit SHAs:\n%s\n' "$invalid_refs"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Test policy enforcement
        run: go test ./internal/securitypolicy ./cmd/security-policy

      - name: Validate policy and active exceptions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(
            --policy .github/security/policy.json
            --exceptions .github/security/exceptions.json
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git cat-file -e "${BASE_SHA}:.github/security/exceptions.json" 2>/dev/null; then
              baseline="$RUNNER_TEMP/base-security-exceptions.json"
              git show "${BASE_SHA}:.github/security/exceptions.json" > "$baseline"
              args+=(--baseline-exceptions "$baseline")
            fi
            args+=(--change-author "$CHANGE_AUTHOR")
          fi

          go run ./cmd/security-policy validate "${args[@]}"

  repository-security:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Test repository controls
        run: go test ./internal/repositorysecurity ./cmd/repository-security

      - name: Scan tracked repository state
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request) scan_context=pull_request ;;
            push) scan_context=default_branch ;;
            merge_group) scan_context=build ;;
            *) echo "Unsupported repository scan event: $EVENT_NAME"; exit 2 ;;
          esac
          go run ./cmd/repository-security \
            --context "$scan_context" \
            --output "$RUNNER_TEMP/repository-security-report.json"

      - name: Evaluate normalized findings
        run: |
          go run ./cmd/security-policy evaluate \
            --policy .github/security/policy.json \
            --exceptions .github/security/exceptions.json \
            --report "$RUNNER_TEMP/repository-security-report.json" \
            --output "$RUNNER_TEMP/repository-security-decision.json"

      - name: Upload redacted repository security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repository-security-report.json
            ${{ runner.temp }}/repository-security-decision.json
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Verify baseline workflow controls
        run: go test ./internal/cibaseline -count=1

      - name: Run formatting, vet, unit and race checks
        run: scripts/ci/backend.sh

      - name: Reject tracked-file drift
        run: git diff --exit-code

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install locked CI tools
        run: npm --prefix ../tools/ci ci

      - name: Install locked dependencies
        run: npm ci

      - name: Check generated declarations before the build
        run: ../scripts/api/check-generated.sh

      - name: Lint without fixing source
        run: npm run lint

      - name: Prove compiler and test failures propagate
        run: node ../scripts/ci/frontend-controls.mjs

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Reject tracked-file drift
        run: git diff --exit-code

  # Compatibility with the active ruleset; remove only after CON-61 remaps it.
  frontend-build-compat:
    name: Frontend production build
    needs: frontend
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete frontend gate
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$FRONTEND_RESULT" = success

  browser:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONSIZE_API_BASE_URL: http://127.0.0.1:18080
      NEXT_PUBLIC_USE_MOCKS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./ui/package.json").packageManager')"

      - name: Install locked dependencies and browser
        working-directory: ui
        run: |
          npm --prefix ../tools/ci ci
          npm ci
          node ../tools/ci/node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build real API and production UI
        run: |
          go build -mod=readonly -o bin/consize-smoke ./cmd/consize
          cd ui
          npm run build

      - name: Exercise browser against real API
        working-directory: ui
        run: npm run test:e2e

      - name: Reject tracked-file drift
        run: git diff --exit-code

      - name: Upload synthetic browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: warn
          retention-days: 7

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject legacy module references
        shell: bash
        run: |
          if git grep -n 'github.com/consize-oss/consize-0' -- '*.go' go.mod; then
            echo 'Legacy consize-0 module references remain.'
            exit 1
          fi
