name: Secret history scan

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history:
    name: Reachable history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete default-branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install checksum-verified Gitleaks
        run: scripts/security/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan all reachable history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          SCAN_CONTEXT: scheduled_scan
        run: scripts/security/run-gitleaks.sh history "$RUNNER_TEMP/gitleaks-history.json"

      - name: Evaluate findings
        run: |
          go run ./cmd/security-policy evaluate \
            --policy .github/security/policy.json \
            --exceptions .github/security/exceptions.json \
            --report "$RUNNER_TEMP/gitleaks-history.json" \
            --output "$RUNNER_TEMP/gitleaks-history-decision.json"

      - name: Upload redacted history evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitleaks-history.json
            ${{ runner.temp }}/gitleaks-history-decision.json
          if-no-files-found: warn
          retention-days: 14
