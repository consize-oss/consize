    Manifest:
      type: object
      required: [id, display_name, version, category, supported_resource_types, supported_action_types, capabilities, can_mutate_infrastructure, requires_approval]
      properties:
        id: {type: string}
        display_name: {type: string}
        version: {type: string}
        category: {type: string}
        supported_resource_types: {type: array, items: {type: string}}
        supported_action_types: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        can_mutate_infrastructure: {type: boolean}
        requires_approval: {type: boolean}
    PluginStatus:
      type: object
      required: [manifest, health]
      properties:
        manifest: {$ref: '#/components/schemas/Manifest'}
        health: {$ref: '#/components/schemas/PluginHealth'}
    PluginHealth:
      type: object
      required: [status, message, checked_at]
      properties:
        status: {type: string}
        message: {type: string}
