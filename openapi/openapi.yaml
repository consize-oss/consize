        recommendations: {type: array, items: {$ref: '#/components/schemas/Recommendation'}}
        plugins: {type: array, items: {$ref: '#/components/schemas/PluginStatus'}}
        actions: {type: array, items: {$ref: '#/components/schemas/ActionEvent'}}
