        actor: {type: string}
        state: {type: string}
        attempts: {type: integer}
        next_run: {type: string, format: date-time}
        window_start: {type: string, format: date-time}
        deadline: {type: string, format: date-time}
        last_error: {type: string}
        verification_result: {$ref: '#/components/schemas/VerificationResult'}
        plugin_result: {$ref: '#/components/schemas/ActionResult'}
        updated_at: {type: string, format: date-time}
    Stats:
      type: object
      required: [projected_savings_monthly, verified_savings_monthly, pending_approvals, rollback_rate, open_recommendations, executed_actions]
      properties:
        projected_savings_monthly: {type: number}
        verified_savings_monthly: {type: number}
        pending_approvals: {type: integer}
        rollback_rate: {type: number}
        open_recommendations: {type: integer}
