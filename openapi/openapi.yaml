openapi: 3.1.0
info:
  title: Consize API
  version: 0.3.0-alpha
  description: The contract for the current Consize product and operational HTTP API.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Operational
    description: Process health endpoints for operators and probes.
  - name: Product
    description: Authenticated product endpoints used by the Consize UI and integrations.
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [Operational]
      security: []
      operationId: getHealth
      summary: Check API health
      description: Reports store, worker, and plugin health without exposing protected product data.
      responses:
        '200': {$ref: '#/components/responses/HealthResponse'}
        '405': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/dashboard:
    get:
      tags: [Product]
      operationId: getDashboard
      summary: Get the operator dashboard
      description: Returns the current resources, recommendations, plugins, actions, jobs, policy, and summary statistics.
      responses:
        '200': {$ref: '#/components/responses/DashboardResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
  /api/resources:
    get:
      tags: [Product]
      operationId: listResources
      summary: List registered resources
      description: Lists provider-neutral resources currently held by the registry.
      responses:
        '200': {$ref: '#/components/responses/ResourcesResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
    post:
      tags: [Product]
      operationId: upsertResource
      summary: Register a resource
      description: Creates or updates one provider-neutral resource; administrator authorization is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceInput'}
      responses:
        '200':
          description: Resource stored successfully.
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/discovery:
    post:
      tags: [Product]
      operationId: runDiscovery
      summary: Run configured discovery plugins
      description: Collects provider observations and upserts their normalized resources into the registry.
      responses:
        '200':
          description: Discovery completed.
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: {type: array, items: {$ref: '#/components/schemas/DiscoveryResult'}}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '502': {$ref: '#/components/responses/ErrorResponse'}
  /api/plugins:
    get:
      tags: [Product]
      operationId: listPlugins
      summary: List plugin status
      description: Lists registered plugin manifests with their latest health status.
      responses:
        '200': {$ref: '#/components/responses/PluginsResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
  /api/actions:
    get:
      tags: [Product]
      operationId: listActions
      summary: List action events
      description: Lists durable action and audit events visible to dashboard users.
      responses:
        '200': {$ref: '#/components/responses/ActionsResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
  /api/action-records:
    get:
      tags: [Product]
      operationId: listActionRecords
      summary: List durable actions
      description: Lists governed action attempts separately from append-only audit events.
      responses:
        '200': {$ref: '#/components/responses/ActionRecordsResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}
  /api/jobs:
    get:
      tags: [Product]
      operationId: listJobs
      summary: List durable jobs
      description: Lists action jobs, including recovery and verification state.
      responses:
        '200': {$ref: '#/components/responses/JobsResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/recommendations/generate:
    post:
      tags: [Product]
      operationId: generateRecommendations
      summary: Generate recommendations
      description: Reads configured metrics for one resource and persists recommendations produced by the active algorithm.
      parameters:
        - name: resource_id
          in: query
          required: true
          description: Stable registry identifier of the resource to evaluate.
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Recommendations generated.
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [recommendations, evidence]
                properties:
                  recommendations: {type: array, items: {$ref: '#/components/schemas/Recommendation'}}
                  evidence: {$ref: '#/components/schemas/MetricsSnapshot'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '502': {$ref: '#/components/responses/ErrorResponse'}
  /api/recommendations/{recommendation_id}/plan:
    post:
      tags: [Product]
      operationId: planRecommendation
      summary: Plan a recommendation
      description: Evaluates policy and plugin preflight in dry-run mode without applying infrastructure changes.
      parameters: [{$ref: '#/components/parameters/RecommendationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
      responses:
        '200':
          description: Dry-run action event and plan.
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ActionEvent'}}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
  /api/recommendations/{recommendation_id}/execute:
    post:
      tags: [Product]
      operationId: executeRecommendation
      summary: Execute an approved recommendation
      description: Persists an approved durable job for worker execution, verification, and recovery.
      parameters: [{$ref: '#/components/parameters/RecommendationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAcceptedResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/recommendations/{recommendation_id}/recover:
    post:
      tags: [Product]
      operationId: recoverRecommendation
      summary: Recover an unresolved recommendation
      description: Explicitly authorizes recovery of an unresolved durable action job.
      parameters: [{$ref: '#/components/parameters/RecommendationId'}]
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAcceptedResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
  /api/audit:
    get:
      tags: [Product]
      operationId: listAuditEvents
      summary: Query the audit history
      description: Returns a stable, cursor-paginated snapshot of provider-neutral domain audit events.
      parameters:
        - {$ref: '#/components/parameters/AuditResourceId'}
        - {$ref: '#/components/parameters/AuditWorkflowId'}
        - {$ref: '#/components/parameters/AuditCorrelationId'}
        - {$ref: '#/components/parameters/AuditFamily'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditSeverity'}
        - {$ref: '#/components/parameters/AuditActorId'}
        - {$ref: '#/components/parameters/AuditPluginId'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
        - {$ref: '#/components/parameters/AuditView'}
        - {$ref: '#/components/parameters/AuditLimit'}
        - {$ref: '#/components/parameters/AuditCursor'}
      responses:
        '200': {$ref: '#/components/responses/AuditPageResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/audit/export:
    get:
      tags: [Product]
      operationId: exportAuditEvents
      summary: Export the audit history
      description: Exports the filtered stable snapshot as newline-delimited JSON in recorded-time and event-ID order.
      parameters:
        - {$ref: '#/components/parameters/AuditResourceId'}
        - {$ref: '#/components/parameters/AuditWorkflowId'}
        - {$ref: '#/components/parameters/AuditCorrelationId'}
        - {$ref: '#/components/parameters/AuditFamily'}
        - {$ref: '#/components/parameters/AuditResult'}
        - {$ref: '#/components/parameters/AuditSeverity'}
        - {$ref: '#/components/parameters/AuditActorId'}
        - {$ref: '#/components/parameters/AuditPluginId'}
        - {$ref: '#/components/parameters/AuditFrom'}
        - {$ref: '#/components/parameters/AuditTo'}
        - {$ref: '#/components/parameters/AuditView'}
      responses:
        '200':
          description: Newline-delimited AuditEvent objects.
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content: {application/x-ndjson: {schema: {type: string}}}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/audit/health:
    get:
      tags: [Operational]
      operationId: getAuditHealth
      summary: Check audit writer health
      description: Reports authoritative audit persistence health and any durable publication backlog without exposing event contents.
      responses:
        '200': {$ref: '#/components/responses/AuditHealthResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/AuditHealthResponse'}
  /api/audit/integrity:
    get:
      tags: [Operational]
      operationId: checkAuditIntegrity
      summary: Check audit record integrity
      description: Checks schema validity, duplicate IDs, causation links, and resource references. It does not prove cryptographic immutability.
      responses:
        '200': {$ref: '#/components/responses/AuditIntegrityResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/AuditIntegrityResponse'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  headers:
    RequestId:
      description: Correlation identifier generated or echoed by the API.
      schema: {type: string, minLength: 1}
  parameters:
    RecommendationId:
      name: recommendation_id
      in: path
      required: true
      description: Numeric recommendation identifier.
      schema: {type: integer, format: int64, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable caller key used to return the original action when a request is repeated.
      schema: {type: string, minLength: 1, maxLength: 200}
    AuditResourceId: {name: resource_id, in: query, schema: {type: string}}
    AuditWorkflowId: {name: workflow_id, in: query, schema: {type: string}}
    AuditCorrelationId: {name: correlation_id, in: query, schema: {type: string}}
    AuditFamily: {name: family, in: query, schema: {$ref: '#/components/schemas/AuditFamily'}}
    AuditResult: {name: result, in: query, schema: {$ref: '#/components/schemas/AuditResult'}}
    AuditSeverity: {name: severity, in: query, schema: {$ref: '#/components/schemas/AuditSeverity'}}
    AuditActorId: {name: actor_id, in: query, schema: {type: string}}
    AuditPluginId: {name: plugin_id, in: query, schema: {type: string}}
    AuditFrom: {name: from, in: query, description: Inclusive recorded-time lower bound., schema: {type: string, format: date-time}}
    AuditTo: {name: to, in: query, description: Exclusive recorded-time upper bound., schema: {type: string, format: date-time}}
    AuditView: {name: view, in: query, schema: {type: string, enum: [summary, detail]}}
    AuditLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    AuditCursor: {name: cursor, in: query, description: Opaque stable-snapshot cursor from the previous response., schema: {type: string}}
  requestBodies:
    ActionRequest:
      required: false
      description: Explicit action mode; execute and recovery require approved.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ActionRequest'}
  responses:
    ErrorResponse:
      description: The request could not be completed.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    HealthResponse:
      description: Current process health.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}
    DashboardResponse:
      description: Current dashboard state.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}
    ResourcesResponse:
      description: Registered resources.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {type: object, required: [resources], properties: {resources: {type: array, items: {$ref: '#/components/schemas/Resource'}}}}}}
    PluginsResponse:
      description: Registered plugin status.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {type: object, required: [plugins], properties: {plugins: {type: array, items: {$ref: '#/components/schemas/PluginStatus'}}}}}}
    ActionsResponse:
      description: Action events.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {type: object, required: [actions], properties: {actions: {type: array, items: {$ref: '#/components/schemas/ActionEvent'}}}}}}
    ActionRecordsResponse:
      description: Durable governed action attempts.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {type: object, required: [actions], properties: {actions: {type: array, items: {$ref: '#/components/schemas/Action'}}}}}}
    JobsResponse:
      description: Durable action jobs.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {type: object, required: [jobs], properties: {jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}}}}}
    JobAcceptedResponse:
      description: Durable job accepted.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {type: object, required: [job], properties: {job: {$ref: '#/components/schemas/Job'}}}}}
    AuditPageResponse:
      description: Stable page of audit events.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}
    AuditHealthResponse:
      description: Audit persistence health and backlog.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/AuditHealth'}}}
    AuditIntegrityResponse:
      description: Audit referential and schema integrity report.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/AuditIntegrityReport'}}}
  schemas:
    AuditFamily:
      type: string
      enum: [resource, discovery, plugin, evidence, recommendation, policy, preflight, authorization, action, worker, verification, rollback, configuration, migration, security]
    AuditResult:
      type: string
      enum: [requested, allowed, denied, succeeded, failed, pending, inconclusive]
    AuditSeverity:
      type: string
      enum: [info, warning, error, critical]
    JsonObject: {type: object, additionalProperties: true}
    Error: {type: object, required: [error], properties: {error: {type: string}}}
    ActionRequest: {type: object, additionalProperties: false, properties: {mode: {type: string, enum: [approved]}}}
    AuditActor:
      type: object
      additionalProperties: false
      required: [type, id]
      properties: {type: {type: string}, id: {type: string}, display: {type: string}}
    AuditResourceRef:
      type: object
      additionalProperties: false
      required: [id]
      properties: {id: {type: string}, type: {type: string}, provider: {type: string}}
    AuditWorkflowRefs:
      type: object
      additionalProperties: false
      properties:
        recommendation_id: {type: string}
        policy_id: {type: string}
        preflight_id: {type: string}
        authorization_id: {type: string}
        action_id: {type: string}
        attempt_id: {type: string}
        plugin_id: {type: string}
        verification_id: {type: string}
        rollback_id: {type: string}
    AuditRedaction:
      type: object
      additionalProperties: false
      required: [applied]
      properties:
        applied: {type: boolean}
        fields: {type: array, items: {type: string}}
        truncated: {type: boolean}
        original_bytes: {type: integer, minimum: 0}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, idempotency_key, type, family, kind, schema_version, timestamp, recorded_at, actor, source, correlation_id, result, severity, visibility, reason_code, summary, redaction]
      properties:
        id: {type: string}
        idempotency_key: {type: string}
        type: {type: string}
        family: {$ref: '#/components/schemas/AuditFamily'}
        kind: {type: string, enum: [command, decision, provider_effect, observation, outcome]}
        schema_version: {type: integer, minimum: 1}
        timestamp: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/AuditActor'}
        source: {type: string}
        resource: {$ref: '#/components/schemas/AuditResourceRef'}
        organization_id: {type: string}
        correlation_id: {type: string}
        causation_id: {type: string}
        workflow: {$ref: '#/components/schemas/AuditWorkflowRefs'}
        result: {$ref: '#/components/schemas/AuditResult'}
        severity: {$ref: '#/components/schemas/AuditSeverity'}
        visibility: {type: string, enum: [summary, detail]}
        reason_code: {type: string}
        summary: {type: string, maxLength: 512}
        details: {$ref: '#/components/schemas/JsonObject'}
        redaction: {$ref: '#/components/schemas/AuditRedaction'}
    AuditPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_cursor: {type: string}
    AuditHealth:
      type: object
      additionalProperties: false
      required: [healthy, backlog, persistence_failures]
      properties:
        healthy: {type: boolean}
        backlog: {type: integer, minimum: 0}
        persistence_failures: {type: integer, minimum: 0}
        oldest_pending_event: {type: string, format: date-time}
        last_error: {type: string}
    AuditIntegrityReport:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid: {type: boolean}
        duplicate_ids: {type: array, items: {type: string}}
        invalid_events: {type: array, items: {type: string}}
        missing_causation_links: {type: array, items: {type: string}}
        orphaned_references: {type: array, items: {type: string}}
    Resource:
      type: object
      required: [schema_version, id, type, provider, provider_resource_id, name, environment, owner, region, account, criticality, lifecycle_state, support_status, labels, metadata, current_state, monthly_cost, source_plugin_id, observed_at, first_seen_at, last_seen_at, created_at, updated_at]
      properties:
        schema_version: {type: integer, minimum: 1, description: Version of the universal resource contract.}
        id: {type: string, minLength: 1, description: Stable Consize identity derived only from immutable provider coordinates for new resources.}
        type: {type: string, minLength: 1, description: Provider-neutral resource type.}
        provider: {type: string, minLength: 1}
        provider_resource_id: {type: string, minLength: 1, description: Stable identity assigned by the provider.}
        name: {type: string, minLength: 1}
        environment: {type: string}
        owner: {type: string, minLength: 1}
        region: {type: string, minLength: 1, description: Provider location or explicit non-regional scope.}
        account: {type: string, minLength: 1, description: "Provider account, project, subscription, or cluster identity."}
        criticality: {type: string, enum: [low, medium, high]}
        lifecycle_state: {type: string, enum: [active, stale, deleted]}
        support_status: {type: string, enum: [fully_supported, model_only, unsupported]}
        labels: {type: object, additionalProperties: {type: string}}
        metadata: {$ref: '#/components/schemas/JsonObject'}
        current_state: {$ref: '#/components/schemas/JsonObject'}
        monthly_cost: {type: number}
        source_plugin_id: {type: string}
        observed_at: {type: string, format: date-time}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ResourceInput:
      type: object
      description: Resource observation accepted from an administrator or trusted discovery adapter. Server-managed model and lifecycle fields are returned in Resource.
      required: [id, type, provider, provider_resource_id, name, environment, owner, region, account, criticality, labels, metadata, current_state, monthly_cost, source_plugin_id, observed_at, created_at, updated_at]
      properties:
        id: {type: string}
        type: {type: string}
        provider: {type: string}
        provider_resource_id: {type: string}
        name: {type: string}
        environment: {type: string}
        owner: {type: string}
        region: {type: string}
        account: {type: string}
        criticality: {type: string, enum: [low, medium, high]}
        labels: {type: object, additionalProperties: {type: string}}
        metadata: {$ref: '#/components/schemas/JsonObject'}
        current_state: {$ref: '#/components/schemas/JsonObject'}
        monthly_cost: {type: number}
        source_plugin_id: {type: string}
        observed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Recommendation:
      type: object
      required: [id, resource_id, plugin_id, algorithm_id, action_type, title, summary, current, proposed, parameters, estimated_savings_monthly, confidence, risk, evidence, policy_id, status, created_at, updated_at]
      properties:
        schema_version: {type: integer, minimum: 1}
        id: {type: integer, format: int64}
        resource_id: {type: string}
        plugin_id: {type: string}
        algorithm_id: {type: string}
        algorithm_version: {type: string}
        recommendation_type: {type: string}
        action_type: {type: string}
        title: {type: string}
        summary: {type: string}
        current: {$ref: '#/components/schemas/JsonObject'}
        proposed: {$ref: '#/components/schemas/JsonObject'}
        parameters: {$ref: '#/components/schemas/JsonObject'}
        estimated_savings_monthly: {type: number}
        savings_estimate: {$ref: '#/components/schemas/SavingsEstimate'}
        cost_estimate: {$ref: '#/components/schemas/CostEstimate'}
        confidence: {type: string}
        risk: {type: string}
        evidence: {type: array, items: {type: string}}
        evidence_refs: {type: array, minItems: 1, items: {type: string}}
        evidence_snapshot: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/EvidenceRecord'}}
        policy_id: {type: string}
        status: {type: string, description: "Recommendation lifecycle state: pending, planned, approved, executing, verified, rejected, expired, superseded, failed, rolled_back, or manual_intervention."}
        expires_at: {type: string, format: date-time}
        superseded_by: {type: integer, format: int64}
        status_reason: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SavingsEstimate:
      type: object
