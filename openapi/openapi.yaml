    PolicyDecision:
      type: object
      required: [policy_id, decision, reasons]
      properties:
        policy_id: {type: string}
        decision: {type: string}
        reasons: {type: array, items: {type: string}}
    PreflightCheck:
      type: object
      required: [id, status, message]
      properties:
        id: {type: string}
        status: {type: string}
        message: {type: string}
        details: {$ref: '#/components/schemas/JsonObject'}
    ActionPlan:
      type: object
      required: [plugin_id, resource_id, action_type, summary, diff, rollback_available, requires_approval]
      properties:
        preflight: {type: array, items: {$ref: '#/components/schemas/PreflightCheck'}}
        plugin_artifact_digest: {type: string}
        plugin_version: {type: string}
        original_state: {$ref: '#/components/schemas/JsonObject'}
        applied_state: {$ref: '#/components/schemas/JsonObject'}
        plugin_id: {type: string}
        resource_id: {type: string}
        action_type: {type: string}
        summary: {type: string}
        diff: {$ref: '#/components/schemas/JsonObject'}
        rollback_available: {type: boolean}
        requires_approval: {type: boolean}
    ActionEvent:
      type: object
      required: [id, resource_id, plugin_id, action_type, actor, mode, result, message, parameters, policy_decision, created_at]
      properties:
        id: {type: integer, format: int64}
        action_id: {type: integer, format: int64}
        recommendation_id: {type: integer, format: int64}
        resource_id: {type: string}
        plugin_id: {type: string}
        action_type: {type: string}
        actor: {type: string}
        mode: {type: string}
        result: {type: string}
        message: {type: string}
        parameters: {$ref: '#/components/schemas/JsonObject'}
        plan: {$ref: '#/components/schemas/ActionPlan'}
        policy_decision: {$ref: '#/components/schemas/PolicyDecision'}
        verification_result: {$ref: '#/components/schemas/VerificationResult'}
        created_at: {type: string, format: date-time}
    Action:
      type: object
      required: [schema_version, id, recommendation_id, resource_id, remediation_path, plugin_id, action_type, mode, idempotency_key, requested_by, policy_decision, status, parameters, requested_at, updated_at]
      properties:
        schema_version: {type: integer, minimum: 1}
        id: {type: integer, format: int64}
        recommendation_id: {type: integer, format: int64}
        resource_id: {type: string}
        remediation_path: {type: string}
        plugin_id: {type: string}
        plugin_version: {type: string}
        action_type: {type: string}
        mode: {type: string, enum: [dry_run, approved]}
        idempotency_key: {type: string}
        correlation_id: {type: string, description: Stable audit correlation identifier propagated through worker execution and recovery.}
        requested_by: {type: string}
        approved_by: {type: string}
        policy_decision: {$ref: '#/components/schemas/PolicyDecision'}
        status: {type: string, enum: [requested, planning, planned, approved, executing, verifying, succeeded, failed, rollback_pending, rolling_back, rolled_back, manual_intervention, cancelled]}
        parameters: {$ref: '#/components/schemas/JsonObject'}
        plan_result: {$ref: '#/components/schemas/PlanResult'}
        execution_result: {$ref: '#/components/schemas/ExecutionResult'}
        failure_code: {type: string}
        failure_message: {type: string}
        requested_at: {type: string, format: date-time}
        approved_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PlanResult:
      type: object
      required: [plan, created_at]
      properties:
        plan: {$ref: '#/components/schemas/ActionPlan'}
        created_at: {type: string, format: date-time}
    ExecutionResult:
      type: object
      required: [result]
      properties:
        result: {$ref: '#/components/schemas/ActionResult'}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    ActionResult:
      type: object
      required: [plugin_id, resource_id, action_type, applied, message, evidence]
      properties:
        plugin_id: {type: string}
        resource_id: {type: string}
        action_type: {type: string}
        applied: {type: boolean}
        message: {type: string}
        evidence: {$ref: '#/components/schemas/JsonObject'}
    VerificationCheck:
      type: object
      required: [signal, statistic, mode, threshold]
      properties:
        signal: {type: string}
        unit: {type: string, description: Canonical unit expected by this verification threshold.}
        statistic: {type: string, enum: [p95, p99, max]}
        mode: {type: string, enum: [absolute, ratio]}
        threshold: {type: number}
    VerificationConfig:
      type: object
      required: [rollback_on_failure, rollback_on_timeout, timeout, isolation, enabled, metrics_plugin_id, wait, max_restart_increase, max_memory_p95_increase_ratio, max_cpu_p95_increase_ratio]
      properties:
        checks: {type: array, items: {$ref: '#/components/schemas/VerificationCheck'}}
        rollback_on_failure: {type: boolean}
        rollback_on_timeout: {type: boolean}
        timeout: {type: string}
        isolation: {type: string}
        enabled: {type: boolean}
        metrics_plugin_id: {type: string}
        wait: {type: string}
        max_restart_increase: {type: number}
        max_memory_p95_increase_ratio: {type: number}
        max_cpu_p95_increase_ratio: {type: number}
    EvidenceRecord:
      type: object
      description: Immutable content-addressed provenance. Null value denotes missing, invalid, or unavailable measurement; a measured zero is numeric zero.
      required: [schema_version, id, resource_id, plugin_id, signal, query, kind, aggregation, unit, original_unit, scale, value, sample_count, window_start, window_end, collected_at, fresh_until, quality]
      properties:
        schema_version: {type: integer, enum: [1]}
        id: {type: string, pattern: '^evidence:v1:[a-f0-9]{64}$'}
        resource_id: {type: string}
        plugin_id: {type: string}
        signal: {type: string}
        query: {type: string, maxLength: 8192}
        kind: {type: string, enum: [raw, aggregated, derived]}
        aggregation: {type: string}
        unit: {type: string}
        original_unit: {type: string}
        scale: {type: number, exclusiveMinimum: 0}
        value: {type: [number, 'null']}
        sample_count: {type: integer, minimum: 0}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        collected_at: {type: string, format: date-time}
        fresh_until: {type: string, format: date-time}
        quality: {type: string, enum: [valid, missing, stale, partial, invalid, unavailable]}
        parents: {type: array, maxItems: 64, items: {type: string}}
        extensions: {type: object, maxProperties: 32, additionalProperties: {type: string, maxLength: 1024}}
    MetricsSnapshot:
      type: object
      required: [plugin_id, resource_id, source, window, signals, evidence, collected_at]
      properties:
        records: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/EvidenceRecord'}}
        plugin_id: {type: string}
        resource_id: {type: string}
        source: {type: string}
        window: {type: string}
        signals: {$ref: '#/components/schemas/JsonObject'}
        evidence: {type: array, items: {type: string}}
        collected_at: {type: string, format: date-time}
        coverage: {$ref: '#/components/schemas/JsonObject'}
    VerificationResult:
      type: object
      required: [status, reasons, before, after, checked_at, thresholds]
      properties:
        status: {type: string}
        reasons: {type: array, items: {type: string}}
        before: {$ref: '#/components/schemas/MetricsSnapshot'}
        after: {$ref: '#/components/schemas/MetricsSnapshot'}
        checked_at: {type: string, format: date-time}
        thresholds: {$ref: '#/components/schemas/JsonObject'}
    Job:
      type: object
      required: [id, resource, plan, baseline, verification, policy, actor, state, attempts, next_run, window_start, deadline, updated_at]
