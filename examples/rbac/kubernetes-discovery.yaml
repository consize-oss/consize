# Namespace-scoped discovery. Change example-workloads to the observed namespace.
# The workload namespace must already exist. Repeat Role/RoleBinding for each
# namespace; do not broaden this identity to support infrastructure actions.
apiVersion: v1
kind: Namespace
metadata:
  name: consize
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consize-discovery
  namespace: consize
# Explicitly opt in on the Consize Pod when using in-cluster authentication.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: consize-discovery
  namespace: example-workloads
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: consize-discovery
  namespace: example-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: consize-discovery
subjects:
  - kind: ServiceAccount
    name: consize-discovery
    namespace: consize
