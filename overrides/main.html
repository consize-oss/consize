{% extends "base.html" %} 
 
{% block extrahead %} 
  <meta name="google-site-verification" content="dSiX4RKwInIHQEeTcq5P-Px8LscqIMDnXrh5cfG_zGY" />
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:description" content="{{ page.meta.description | default(config.site_description, true) }}" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta property="og:type" content="article" />
  <meta property="og:image" content="{{ page.meta.image }}" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Consize OSS",
    "url": "https://docs.consizehq.com/",
    "logo": "https://docs.consizehq.com/assets/logo-mark.png",
    "sameAs": [
      "https://github.com/consize-oss/consize"
    ]
  }
  </script>

  {{ super() }}  
{% endblock %}  
  
{% block content %}  
  {{ super() }}  
  {% include "partials/consize-page-feedback.html" %}  
{% endblock %}  
  
{% block footer %}  
  <div class="consize-site-footer">  
    <div class="consize-site-footer__inner">  
      {% include "partials/consize-footer-links.html" %}  
    </div>  
  </div>  
  {{ super() }}  
{% endblock %}
