site_name: Consize
site_url: https://docs.consizehq.com
site_description: Safely optimize cloud, AI and SaaS resources with automated policies, guardrails, and built-in rollback.
site_author: Consize OSS
repo_url: https://github.com/consize-oss/consize
repo_name: consize-oss/consize
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-mark.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default        
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate      
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_readtime: true
      pagination_per_page: 10
      categories: true
      categories_allowed:
        - Announcements
        - Engineering
        - Guides
        - Comparisons
        - FinOps
        - Security
        - Community
        - Product
      archive: true
      archive_date_format: yyyy
      authors: true
  - llmstxt:
      markdown_description: >
        Consize is an open-source safety engine for infrastructure cost
        optimization. It finds waste across Kubernetes and cloud resources,
        applies changes in small verified steps, and rolls back automatically
        if anything degrades.
      full_output: llms-full.txt
      sections:
        Get started:
          - getting-started/get-started.md: Overview and quickstart
          - getting-started/sandbox.md: Interactive Docker sandbox
          - getting-started/installation.md: Production Helm install
        Guides:
          - guides/rightsizing.md: Kubernetes rightsizing, why percentiles not averages
          - guides/observability.md
          - guides/environments.md
          - concepts/architecture.md: How Consize works end to end
          - concepts/safety-net.md: The safety decision matrix (BLOCK/SPLIT/REJECT/etc)
        Reference:
          - reference/configuration.md
          - reference/resource-model.md
          - reference/supported-platforms.md
          - reference/api.md
        Resources:
          - resources/decisions.md: How and why decisions get documented
          - resources/faq.md
          - resources/troubleshooting.md

nav:
  - Get started:
      - Overview: getting-started/get-started.md
      - Interactive Sandbox: getting-started/sandbox.md
      - Production Installation: getting-started/installation.md

  - Guides:
      - Kubernetes Rightsizing: guides/rightsizing.md
      - Observability: guides/observability.md
      - Environments: guides/environments.md
      - How Consize Works: concepts/architecture.md
      - The Safety Net: concepts/safety-net.md

  - Reference:
      - Configuration: reference/configuration.md
      - Resource Model: reference/resource-model.md
      - Supported Platforms: reference/supported-platforms.md
      - API Reference: reference/api.md
      - Audit Subsystem: engineering/audit-subsystem.md
      - Runtime Data and Demo Isolation: engineering/runtime-data.md

  - Resources:
      - Contributing: resources/contributing.md
      - Testing: resources/testing.md
      - E2E Tests: resources/e2e.md
      - Decisions: resources/decisions.md
      - Roadmap: resources/roadmap.md
      - FAQ: resources/faq.md
      - Troubleshooting: resources/troubleshooting.md
      - Support: resources/support.md

  - Blog: blog/index.md

markdown_extensions:
  - admonition
  - attr_list        # required for grid cards / button styling
  - md_in_html        # required for grid cards
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [_snippets]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mermaid-init.js
  - javascripts/page-feedback.js
  - javascripts/search-suggestions.js
  - javascripts/copy-page.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/consize-oss/consize
    - icon: fontawesome/brands/slack
      link: https://consizetownhall.slack.com/

extra_css:
  - stylesheets/extra.css
  - stylesheets/blog.css
  - stylesheets/blog-post.css
  
